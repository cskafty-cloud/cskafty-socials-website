name: Deploy CSKAFTY website and build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish standalone Windows executable
        run: dotnet publish windows/CSKAFTY.Launcher/CSKAFTY.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package Windows app and source ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish/CSKAFTY.Launcher.exe package/CSKAFTY.exe
          Copy-Item windows/Launch-CSKAFTY.bat package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath CSKAFTY-Windows.zip -Force
          Compress-Archive -Path index.html,README.md,supabase,windows,.github -DestinationPath CSKAFTY-Source.zip -Force
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: CSKAFTY-Windows-and-Source
          path: |
            CSKAFTY-Windows.zip
            CSKAFTY-Source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish public Windows release downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: CSKAFTY Windows App
          body: Download CSKAFTY.exe to open the live CSKAFTY website in your default browser. The ZIP includes the executable and launcher script.
          files: |
            publish/CSKAFTY.Launcher.exe
            CSKAFTY-Windows.zip
            CSKAFTY-Source.zip
          overwrite_files: true
          make_latest: true
